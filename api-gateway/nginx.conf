events {
    worker_connections 1024;
}

http {

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream auth_service {
        server auth-service:8000;
    }
    upstream academic_service {
        server academic-service:8001;
    }
    upstream finance_service {
        server finance-service:8002;
    }
    upstream hr_service {
        server hr-service:8003;
    }
    server {
        listen 80;

        limit_req zone=api_limit burst=20 nodelay;

        # Routage vers Auth Service
        location /api/v1/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/academic/ {
            proxy_pass http://academic_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/finance/ {
            proxy_pass http://finance_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/hr/ {
            proxy_pass http://hr_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}