version: '3.8'

services:
  
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: erp_api_gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
    networks:
      - erp-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: erp_auth_service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    networks:
      - erp-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: erp_rabbitmq
    ports:
      - "5672:5672"  
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  rabbitmq_data: