version: '3.8'

services:


  api-gateway:
    build: ./api-gateway
    container_name: erp_api_gateway
    ports:
      - "8000:80"           
    depends_on:
      - auth-service
    networks:
      - erp-network

  auth-service:
    build: ./auth-service
    container_name: erp_auth_service
    ports:
      - "8001:8000"          
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    networks:
      - erp-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: erp_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

    networks:


      - erp-network

networks:
  erp-network:
    driver: bridge

